<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040306"/>
      <stop offset="100%" stop-color="#020103"/>
    </linearGradient>

    <!-- Top Glow Line -->
    <linearGradient id="fuchsiaLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff007f" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ff2a85" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ff007f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="130" fill="url(#footerBg)"/>

  <!-- Top Accent Laser Line -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#fuchsiaLaser)" stroke-width="1.5"/>

  <!-- Center Floating Minimalist Security Node -->
  <g transform="translate(600, 24)">
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#08040d" stroke="#ff007f" stroke-width="1.2" filter="url(#softGlow)"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- Terminal Philosophy Text (No emojis) -->
  <g font-family="'Fira Code', 'Cascadia Code', monospace" text-anchor="middle">
    
    <!-- Status Line -->
    <text x="600" y="62" font-size="11.5" fill="#71717a" letter-spacing="0.8px" font-weight="600">
      <tspan fill="#ff007f">[</tspan> <tspan fill="#ff70a6">INTEGRITY_CHECK: PASSED</tspan> <tspan fill="#3f3f46">//</tspan> <tspan fill="#d4d4d8">PIPELINE: ACTIVE</tspan> <tspan fill="#ff007f">]</tspan>
    </text>

    <!-- Quote -->
    <text x="600" y="90" font-size="14" fill="#f4f4f5" font-weight="500">
      <tspan fill="#52525b">/* </tspan>
      <tspan fill="#e4e4e7">"Entender el código y analizar sistemas para mantenerlos seguros."</tspan>
      <tspan fill="#52525b"> */</tspan>
    </text>

    <!-- Signature -->
    <text x="600" y="115" font-size="12" fill="#71717a" font-weight="400">
      Sebastian Doncel <tspan fill="#3f3f46">(</tspan><tspan fill="#ff007f">@Sbznn17dev</tspan><tspan fill="#3f3f46">)</tspan> - <tspan fill="#a1a1aa">Colombia</tspan>
    </text>

  </g>
</svg>
